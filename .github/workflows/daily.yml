name: Daily PSX analysis
on:
  schedule:
    # 5:00 PM PKT = 12:00 UTC, Mon-Fri (+ 7:30 PM PKT retry)
    - cron: "0 12 * * 1-5"
    - cron: "30 14 * * 1-5"
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  analyze:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy psxdata
      - run: python daily_update.py
      - name: Commit results
        run: |
          git config user.name "psx-bot"
          git config user.email "bot@users.noreply.github.com"
          git pull --rebase
          git add data/psx.sqlite output/ failed_symbols.txt
          git commit -m "Daily analysis $(date -u +%F)" || echo "no changes"
          git push